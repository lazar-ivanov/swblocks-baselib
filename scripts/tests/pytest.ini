[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Test paths
testpaths = .

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Selectively filter warnings from 3rd party libraries while keeping our own warnings visible
# Syntax: action:message:category:module:line
# Module field matches as substring (no wildcards needed)
#
# Note that the entries below ignore specific deprecation warnings from 3rd party libraries, with
# message based filtering to catch both standard and custom warning classes; all other warnings,
# including from our own code, are still shown
#
# Keep comments OUT of the linelist value itself. Whether iniconfig strips a '#' line which is
# indented inside a multi-line value is version dependent, and where it does not the line is parsed
# as a warning filter and pytest fails to start
filterwarnings =
    ignore:Boto3 will no longer support::boto3
    ignore::DeprecationWarning:botocore
    ignore::DeprecationWarning:moto
    ignore::DeprecationWarning:s3transfer
