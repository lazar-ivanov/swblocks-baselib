[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Test paths
testpaths = .

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage options (when run with --cov)
[coverage:run]
source = ../
omit =
    */tests/*
    */__pycache__/*
    */.*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

# Coverage failure threshold
fail_under = 80.0
