[pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum pytest version
minversion = 7.0

# Test paths
testpaths = .

# Output options
addopts =
    -v
    --tb=short
    --strict-markers

# Selectively filter warnings from 3rd party libraries while keeping our own warnings visible
# Syntax: action:message:category:module:line
# Module field matches as substring (no wildcards needed)
filterwarnings =
    # Ignore specific deprecation warnings from 3rd party libraries
    # Message-based filtering catches both standard and custom warning classes
    ignore:Boto3 will no longer support::boto3
    ignore::DeprecationWarning:botocore
    ignore::DeprecationWarning:moto
    ignore::DeprecationWarning:s3transfer
    # All other warnings (including from our code) will be shown
