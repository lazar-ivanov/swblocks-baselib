#
# Config for certs/test-server-ip-cert.pem
#
# A self-signed test certificate used by the TlsPeerVerification unit tests (offline name
# matching) and, together with its key, by the TlsHandshake unit tests as the certificate of a
# server whose chain is NOT trusted: its issuer is itself and is never registered as a root, so
# it needs no CA and no key usage beyond the defaults.
#
# The SAN set is chosen so that a single certificate covers every branch of the peer-name
# match, including the RFC 6125 rule that an IP address literal must NOT be matched against
# the certificate's DNS names:
#
#   IP:127.0.0.1        - an address literal which matches
#   IP:::1              - the same for IPv6
#   DNS:10.11.12.13     - a DNS entry which LOOKS like an address; asking for 10.11.12.13 must
#                         still fail, because that name is a literal and there is no such IP SAN
#   DNS:example.test    - an ordinary DNS name which matches
#
[ req ]
distinguished_name               = req_distinguished_name
req_extensions                   = v3_req
prompt                           = no

[ req_distinguished_name ]
countryName                      = US
stateOrProvinceName              = New York
localityName                     = NYC
0.organizationName               = My Company Ltd
commonName                       = example.test

[ v3_req ]
basicConstraints                 = CA:FALSE
keyUsage                         = nonRepudiation, digitalSignature, keyEncipherment
subjectAltName                   = @alt_names

[alt_names]
DNS.1                            = example.test
DNS.2                            = 10.11.12.13
IP.1                             = 127.0.0.1
IP.2                             = ::1
